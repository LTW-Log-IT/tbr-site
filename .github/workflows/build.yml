# Static build check for GitHub Pages scaffold (deploy workflow: HUB-54 / Bridge).
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:pricing
      - run: npm run build
      - run: test -f dist/CNAME && grep -q leadthewaylogistics.info dist/CNAME
